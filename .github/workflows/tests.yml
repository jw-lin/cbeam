name: tests

# Run the test suite (see docs_source/testing.rst) on every pull request.
# This intentionally does not touch the built documentation under docs/ -
# that is rebuilt separately, from a pinned toolchain, not from CI.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Cache Julia install and precompiled packages
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('src/cbeam/FEval/Project.toml') }}

      # dependency list follows docs_source/installation.rst
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy numexpr matplotlib meshio pygmsh gmsh juliacall pytest
          pip install git+https://github.com/jw-lin/wavesolve.git
          pip install -e .

      - name: Set up Julia dependencies and precompile FEval
        run: python -c "import cbeam; cbeam.FEvalsetup()"

      - name: Run test suite
        run: pytest -v
